---
# Optional overrides. AAP injects K8S_AUTH_* from the OpenShift credential.
demo_mode: read_only
ocp_verify_ssl: "{{ lookup('env', 'K8S_AUTH_VERIFY_SSL') | default('yes', true) | bool }}"

# Namespaces commonly used by OpenShift Virtualization
cnv_operator_namespace: openshift-cnv
kubevirt_cr_name: kubevirt-kubevirt-hyperconverged
