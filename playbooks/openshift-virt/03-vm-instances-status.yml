---
- name: OpenShift Virtualization Running Instance Status (Read-Only)
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../vars/demo.yml

  tasks:
    - name: Verify VirtualMachineInstance CRD is available
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: virtualmachineinstances.kubevirt.io
      register: vmi_crd

    - name: Report when CNV is not installed
      ansible.builtin.debug:
        msg: "Skipping VMI status: virtualmachineinstances.kubevirt.io CRD not found."
      when: vmi_crd.resources | length == 0

    - name: List all VirtualMachineInstance objects
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachineInstance
      register: vmis
      when: vmi_crd.resources | length > 0

    - name: Summarize running VM instances
      ansible.builtin.debug:
        msg:
          total_vmis: "{{ vmis.resources | length }}"
          running: "{{ vmis.resources | selectattr('status.phase', 'equalto', 'Running') | list | length }}"
          scheduling: "{{ vmis.resources | selectattr('status.phase', 'equalto', 'Scheduling') | list | length }}"
          failed: "{{ vmis.resources | selectattr('status.phase', 'equalto', 'Failed') | list | length }}"
      when: vmis.resources is defined

    - name: Display VMI node placement and IP addressing
      ansible.builtin.debug:
        msg:
          namespace: "{{ item.metadata.namespace }}"
          name: "{{ item.metadata.name }}"
          phase: "{{ item.status.phase | default('Unknown') }}"
          node: "{{ item.status.nodeName | default('unscheduled') }}"
          ip: "{{ item.status.interfaces | default([]) | map(attribute='ipAddress') | reject('equalto', '') | list | first | default('n/a') }}"
      loop: "{{ vmis.resources | default([]) }}"
      loop_control:
        label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"
      when: vmis.resources is defined
