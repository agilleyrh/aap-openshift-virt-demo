---
- name: OpenShift Virtualization Storage Inventory (Read-Only)
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../vars/demo.yml

  tasks:
    - name: Verify DataVolume CRD is available
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: datavolumes.cdi.kubevirt.io
      register: dv_crd

    - name: Report when CDI/CNV storage APIs are unavailable
      ansible.builtin.debug:
        msg: "Skipping DataVolume inventory: datavolumes.cdi.kubevirt.io CRD not found."
      when: dv_crd.resources | length == 0

    - name: List DataVolume resources
      kubernetes.core.k8s_info:
        api_version: cdi.kubevirt.io/v1beta1
        kind: DataVolume
      register: datavolumes
      when: dv_crd.resources | length > 0

    - name: Summarize DataVolumes
      ansible.builtin.debug:
        msg:
          total_datavolumes: "{{ datavolumes.resources | length }}"
          phases: "{{ datavolumes.resources | map(attribute='status.phase') | list | unique }}"
      when: datavolumes.resources is defined

    - name: Display DataVolume details
      ansible.builtin.debug:
        msg:
          namespace: "{{ item.metadata.namespace }}"
          name: "{{ item.metadata.name }}"
          phase: "{{ item.status.phase | default('Unknown') }}"
          source: "{{ item.spec.source | default({}) | dict2items | map(attribute='key') | list }}"
          capacity: "{{ item.status.storage.capacity | default('pending') }}"
      loop: "{{ datavolumes.resources | default([]) }}"
      loop_control:
        label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"
      when: datavolumes.resources is defined

    - name: List PVCs labeled for VM storage
      kubernetes.core.k8s_info:
        api_version: v1
        kind: PersistentVolumeClaim
        label_selectors:
          - kubevirt.io
      register: virt_pvcs
      failed_when: false

    - name: Summarize virtualization-related PVCs
      ansible.builtin.debug:
        msg:
          virt_pvcs_found: "{{ virt_pvcs.resources | default([]) | length }}"
          namespaces: "{{ virt_pvcs.resources | default([]) | map(attribute='metadata.namespace') | unique | list | sort }}"
