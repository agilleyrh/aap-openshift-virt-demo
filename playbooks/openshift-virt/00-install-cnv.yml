---
- name: Install OpenShift Virtualization Operator (Demo Bootstrap)
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../vars/demo.yml

  vars:
    cnv_namespace: openshift-cnv
    cnv_channel: stable
    cnv_package: kubevirt-hyperconverged

  tasks:
    - name: Create openshift-cnv namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ cnv_namespace }}"
            labels:
              openshift.io/cluster-monitoring: "true"

    - name: Create OperatorGroup for CNV
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: kubevirt-hyperconverged-group
            namespace: "{{ cnv_namespace }}"
          spec:
            targetNamespaces:
              - "{{ cnv_namespace }}"

    - name: Subscribe to kubevirt-hyperconverged operator
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: hco-operatorhub
            namespace: "{{ cnv_namespace }}"
          spec:
            source: redhat-operators
            sourceNamespace: openshift-marketplace
            name: "{{ cnv_package }}"
            channel: "{{ cnv_channel }}"
            installPlanApproval: Automatic

    - name: Wait until HyperConverged CRD exists
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: hyperconvergeds.hco.kubevirt.io
      register: hc_crd
      until: hc_crd.resources | length > 0
      retries: 60
      delay: 10

    - name: Deploy HyperConverged custom resource
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: hco.kubevirt.io/v1beta1
          kind: HyperConverged
          metadata:
            name: kubevirt-hyperconverged
            namespace: "{{ cnv_namespace }}"
            annotations:
              deployOVS: "false"
          spec: {}

    - name: Wait for HyperConverged Available condition
      kubernetes.core.k8s_info:
        api_version: hco.kubevirt.io/v1beta1
        kind: HyperConverged
        name: kubevirt-hyperconverged
        namespace: "{{ cnv_namespace }}"
      register: hyperconverged
      until: >-
        hyperconverged.resources | length > 0 and
        (
          hyperconverged.resources[0].status.conditions | default([])
          | selectattr('type', 'equalto', 'Available')
          | selectattr('status', 'equalto', 'True')
          | list | length > 0
        )
      retries: 90
      delay: 10

    - name: Report OpenShift Virtualization installation status
      ansible.builtin.debug:
        msg:
          namespace: "{{ cnv_namespace }}"
          status: "OpenShift Virtualization is Available"
          conditions: "{{ hyperconverged.resources[0].status.conditions | default([]) }}"
