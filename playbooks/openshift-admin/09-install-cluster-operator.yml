---
- name: Install an OpenShift operator from OperatorHub
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../vars/admin.yml

  tasks:
    - name: Create operator namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ operator_install_namespace }}"
            labels:
              app.kubernetes.io/managed-by: aap
              demo: operator-install

    - name: Create OperatorGroup
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: aap-demo-operator-group
            namespace: "{{ operator_install_namespace }}"
          spec:
            targetNamespaces:
              - "{{ operator_install_namespace }}"

    - name: Subscribe to operator package
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: aap-demo-operator-subscription
            namespace: "{{ operator_install_namespace }}"
          spec:
            channel: "{{ operator_channel }}"
            name: "{{ operator_package }}"
            source: "{{ operator_source }}"
            sourceNamespace: "{{ operator_source_namespace }}"
            installPlanApproval: Automatic

    - name: Wait for ClusterServiceVersion to succeed
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        namespace: "{{ operator_install_namespace }}"
      register: csvs
      until: >-
        csvs.resources | length > 0 and
        (
          csvs.resources
          | selectattr('spec.displayName', 'search', 'NMState|nmstate|Node Maintenance|MetalLB')
          | selectattr('status.phase', 'equalto', 'Succeeded')
          | list | length > 0
          or
          csvs.resources | selectattr('status.phase', 'equalto', 'Succeeded') | list | length > 0
        )
      retries: 60
      delay: 10
      failed_when: false

    - name: Display operator installation status
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: Subscription
        name: aap-demo-operator-subscription
        namespace: "{{ operator_install_namespace }}"
      register: sub

    - name: Show subscription and CSV
      ansible.builtin.debug:
        msg:
          namespace: "{{ operator_install_namespace }}"
          package: "{{ operator_package }}"
          channel: "{{ operator_channel }}"
          installed_csv: "{{ sub.resources[0].status.installedCSV | default('pending') }}"
          state: "{{ sub.resources[0].status.state | default('unknown') }}"
