---
- name: Create demo service account and RBAC
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../vars/admin.yml

  tasks:
    - name: Create ServiceAccount
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: "{{ sa_name }}"
            namespace: "{{ demo_namespace }}"
            labels:
              app.kubernetes.io/managed-by: aap

    - name: Create Role with namespace read access
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: "{{ role_name }}"
            namespace: "{{ demo_namespace }}"
          rules:
            - apiGroups: [""]
              resources: ["pods", "services", "configmaps", "persistentvolumeclaims", "events"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["apps"]
              resources: ["deployments", "replicasets"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["route.openshift.io"]
              resources: ["routes"]
              verbs: ["get", "list", "watch"]

    - name: Bind Role to ServiceAccount
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: "{{ sa_name }}-binding"
            namespace: "{{ demo_namespace }}"
          subjects:
            - kind: ServiceAccount
              name: "{{ sa_name }}"
              namespace: "{{ demo_namespace }}"
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: "{{ role_name }}"

    - name: Display RBAC summary
      ansible.builtin.debug:
        msg:
          service_account: "{{ sa_name }}"
          namespace: "{{ demo_namespace }}"
          role: "{{ role_name }}"
          capabilities: "Read-only access to core workloads and routes in demo namespace"
