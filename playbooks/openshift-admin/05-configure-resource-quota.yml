---
- name: Configure resource quota for demo namespace
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../vars/admin.yml

  tasks:
    - name: Apply ResourceQuota
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ResourceQuota
          metadata:
            name: aap-demo-quota
            namespace: "{{ demo_namespace }}"
            labels:
              app.kubernetes.io/managed-by: aap
          spec:
            hard:
              pods: "{{ resource_quota_pods }}"
              requests.cpu: "{{ resource_quota_requests_cpu }}"
              requests.memory: "{{ resource_quota_requests_memory }}"

    - name: Apply LimitRange defaults
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: LimitRange
          metadata:
            name: aap-demo-limits
            namespace: "{{ demo_namespace }}"
          spec:
            limits:
              - type: Container
                defaultRequest:
                  cpu: 100m
                  memory: 128Mi
                default:
                  cpu: 500m
                  memory: 512Mi

    - name: Show quota usage
      kubernetes.core.k8s_info:
        api_version: v1
        kind: ResourceQuota
        name: aap-demo-quota
        namespace: "{{ demo_namespace }}"
      register: quota

    - name: Display quota status
      ansible.builtin.debug:
        var: quota.resources[0].status
