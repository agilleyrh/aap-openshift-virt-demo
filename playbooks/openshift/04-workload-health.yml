---
- name: OpenShift Workload Health Summary (Read-Only)
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../vars/demo.yml

  vars:
    target_namespaces_effective: "{{ target_namespaces }}"

  tasks:
    - name: Normalize namespace list from survey input
      ansible.builtin.set_fact:
        target_namespaces_effective: >-
          {{
            target_namespaces.split(',') | map('trim') | list
            if target_namespaces is string
            else target_namespaces
          }}

    - name: Gather deployments in selected namespaces
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ item }}"
      loop: "{{ target_namespaces_effective }}"
      register: deployments_by_ns
      failed_when: false

    - name: Summarize deployments per namespace
      ansible.builtin.debug:
        msg:
          namespace: "{{ item.item }}"
          deployments: "{{ item.resources | default([]) | length }}"
          unavailable: >-
            {{
              item.resources | default([])
              | selectattr('status.unavailableReplicas', 'defined')
              | selectattr('status.unavailableReplicas', 'gt', 0)
              | map(attribute='metadata.name')
              | list
            }}
      loop: "{{ deployments_by_ns.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Gather pods in selected namespaces
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ item }}"
      loop: "{{ target_namespaces_effective }}"
      register: pods_by_ns
      failed_when: false

    - name: Summarize pod phases per namespace
      ansible.builtin.debug:
        msg:
          namespace: "{{ item.item }}"
          total_pods: "{{ item.resources | default([]) | length }}"
          running: "{{ item.resources | default([]) | selectattr('status.phase', 'equalto', 'Running') | list | length }}"
          pending: "{{ item.resources | default([]) | selectattr('status.phase', 'equalto', 'Pending') | list | length }}"
          failed: "{{ item.resources | default([]) | selectattr('status.phase', 'equalto', 'Failed') | list | length }}"
      loop: "{{ pods_by_ns.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Report non-running pods
      ansible.builtin.debug:
        msg:
          namespace: "{{ item.metadata.namespace }}"
          pod: "{{ item.metadata.name }}"
          phase: "{{ item.status.phase }}"
      loop: >-
        {{
          pods_by_ns.results
          | map(attribute='resources')
          | flatten
          | rejectattr('status.phase', 'equalto', 'Running')
          | list
        }}
      loop_control:
        label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"
